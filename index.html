<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000">
<title>Visual Novel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --box: rgba(14, 18, 32, .82);
    --line: rgba(160, 200, 255, .35);
    --accent: #8fd3ff;
    --txt: #f3f6ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--txt); overflow: hidden;
    font-family: "Noto Sans KR", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: #111 center / cover no-repeat; }
  #bg2 { opacity: 0; }

  /* 캐릭터 */
  #chars { position: absolute; inset: 0; pointer-events: none; }
  #chars img { position: absolute; bottom: 0; height: 88%; max-width: 92vw; object-fit: contain; object-position: bottom;
    left: 50%; transform: translate(-50%, 4%); opacity: 0; transition: opacity .4s, transform .4s, filter .3s, left .4s;
    filter: drop-shadow(0 0 12px rgba(0,0,0,.35)); }
  #chars img.on { opacity: 1; transform: translate(-50%, 0); }
  #chars img[data-pos="left"]  { left: 25%; }
  #chars img[data-pos="right"] { left: 75%; }
  #chars img.dim { filter: brightness(.6) drop-shadow(0 0 12px rgba(0,0,0,.35)); }
  #chars img.bounce { animation: bounce .3s; }
  @keyframes bounce { 50% { transform: translate(-50%, -2%); } }
  @media (orientation: portrait) {
    #chars img { height: 72%; bottom: 14%; }
    #chars img[data-pos="left"]  { left: 30%; }
    #chars img[data-pos="right"] { left: 70%; }
  }

  /* 텍스트 박스 */
  #textbox { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
    width: min(960px, calc(100% - 20px)); min-height: 150px; padding: 26px 22px 20px;
    background: var(--box); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #name { position: absolute; top: -16px; left: 18px; padding: 4px 16px; border-radius: 999px;
    background: #182038; border: 1px solid var(--line); font-weight: 700; font-size: 15px; letter-spacing: .05em; }
  #text { font-family: "Gowun Batang", serif; font-size: clamp(16px, 2.2vw + 8px, 21px); line-height: 1.75; white-space: pre-wrap; word-break: keep-all; }
  #text.narration { color: #d9def0; }
  #next-ind { position: absolute; right: 18px; bottom: 10px; opacity: 0; color: var(--accent); }
  #next-ind.on { opacity: 1; animation: blink 1s infinite; }
  @keyframes blink { 50% { transform: translateY(3px); opacity: .4; } }

  /* 메뉴 */
  #menu { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #menu button { background: rgba(10,14,26,.6); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
  #menu button.active { background: var(--accent); color: #0b1020; font-weight: 700; }

  /* 선택지 */
  #choices { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 20px 20px 190px; background: rgba(0,0,0,.25); }
  .choice { width: min(560px, 100%); padding: 16px 20px; border-radius: 14px; background: rgba(18,24,44,.9); border: 1px solid var(--line);
    font-size: 16px; text-align: center; animation: pop .25s both; }
  .choice:hover, .choice:active { background: var(--accent); color: #0b1020; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }

  #fx { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translate(-8px, 2px); } 40% { transform: translate(7px, -3px); } 60% { transform: translate(-5px, 1px); } 80% { transform: translate(4px, 0); } }

  /* 오버레이 (타이틀/엔딩/패널) */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #title { z-index: 10; background: #000; }
  #title-bg { position: absolute; inset: 0; background: center / cover; filter: blur(2px) brightness(.55); transform: scale(1.05); }
  #title > *:not(#title-bg) { position: relative; }
  #title-name { font-family: "Gowun Batang", serif; font-size: clamp(32px, 8vw, 64px); font-weight: 700; margin: 0; text-shadow: 0 4px 24px rgba(0,0,0,.6); text-align: center; padding: 0 16px; }
  #title-sub { letter-spacing: .4em; font-size: 13px; opacity: .8; margin: 8px 0 40px; }
  .t-btn { width: 220px; padding: 14px; margin: 6px; border-radius: 12px; background: rgba(14,18,32,.75); border: 1px solid var(--line); font-size: 16px; }
  .t-btn:active, .t-btn:hover { background: var(--accent); color: #0b1020; }
  #title-endings { margin-top: 24px; font-size: 12px; opacity: .75; padding: 0 16px; text-align: center; }

  #ending { z-index: 11; background: rgba(0,0,0,.85); animation: fadein 1.2s both; }
  #ending-name { font-family: "Gowun Batang", serif; font-size: clamp(22px, 5vw, 36px); margin-bottom: 30px; text-align: center; padding: 0 16px; }
  @keyframes fadein { from { opacity: 0; } }

  #panel { z-index: 20; background: rgba(0,0,0,.6); padding: 16px; }
  #panel-inner { width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column; background: #10162a; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  #panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; }
  #panel-close { background: none; border: 0; font-size: 22px; line-height: 1; padding: 0 4px; }
  #panel-body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .slot { display: flex; flex-direction: column; text-align: left; gap: 2px; padding: 12px 14px; border-radius: 10px; background: #182038; border: 1px solid transparent; }
  .slot:hover, .slot:active { border-color: var(--accent); }
  .slot span { font-size: 14px; opacity: .9; } .slot small { font-size: 11px; opacity: .6; } .slot .empty { opacity: .5; }
  .log-line { font-size: 14px; line-height: 1.6; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .log-line b { display: block; font-size: 12px; }
  .log-line i { font-style: normal; opacity: .8; }
  .setting { display: flex; flex-direction: column; gap: 8px; } .setting input { width: 100%; }
  .hint { font-size: 12px; opacity: .6; margin: 0 0 8px; }

  #toast { position: fixed; z-index: 30; left: 50%; top: 20%; transform: translate(-50%, -10px); background: var(--accent); color: #0b1020;
    padding: 8px 18px; border-radius: 999px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div id="stage">
    <div class="bg" id="bg"></div>
    <div class="bg" id="bg2"></div>
    <div id="chars"></div>
    <div id="choices" hidden></div>
    <div id="textbox" hidden>
      <div id="name"></div>
      <div id="text"></div>
      <div id="next-ind">▼</div>
    </div>
    <div id="menu">
      <button id="btn-auto">자동</button>
      <button id="btn-skip">스킵</button>
      <button id="btn-log">로그</button>
      <button id="btn-save">저장</button>
      <button id="btn-load">불러오기</button>
      <button id="btn-set">⚙️</button>
    </div>
    <div id="fx"></div>
  </div>

  <div id="title" class="overlay">
    <div id="title-bg"></div>
    <h1 id="title-name"></h1>
    <div id="title-sub"></div>
    <button class="t-btn" id="t-start">처음부터</button>
    <button class="t-btn" id="t-load">이어하기</button>
    <button class="t-btn" id="t-set">설정</button>
    <div id="title-endings"></div>
  </div>

  <div id="ending" class="overlay" hidden>
    <div id="ending-name"></div>
    <button class="t-btn" id="ending-btn">타이틀로</button>
  </div>

  <div id="panel" class="overlay" hidden>
    <div id="panel-inner">
      <div id="panel-head"><span id="panel-title"></span><button id="panel-close" aria-label="닫기">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="story.js"></script>
  <script src="engine.js"></script>
</body>
</html>
